name: Refresh planet data

# Runs every Monday and can also be started by hand (Actions tab > Refresh planet data > Run workflow).
# If NASA is unreachable, this job fails and nothing is changed: the site keeps its last good data.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download from NASA Exoplanet Archive
        run: node scripts/fetch-nasa.mjs
      - name: Convert to the website's data file
        run: node scripts/build-data.mjs
      - name: Check the result
        run: node scripts/test.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "exoplanet-atlas bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/planets.json data/raw/planets.csv
          if git diff --cached --quiet; then
            echo "No changes in NASA's data this week."
          else
            git commit -m "Refresh planet data from NASA Exoplanet Archive"
            git push
          fi
